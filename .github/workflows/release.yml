name: Validate and publish WordPress release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "assets/**"
      - "includes/**"
      - "tests/**"
      - "sacci-island-admin.php"
      - "uninstall.php"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "assets/**"
      - "includes/**"
      - "tests/**"
      - "sacci-island-admin.php"
      - "uninstall.php"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacci-wordpress-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' sacci-island-admin.php | head -n 1)"
          constant="$(sed -nE "s/^define\\('SACCI_ISLAND_VERSION', '([0-9]+\\.[0-9]+\\.[0-9]+)'\\);$/\\1/p" sacci-island-admin.php | head -n 1)"

          if [[ -z "$version" || "$version" != "$constant" ]]; then
            echo "Plugin header and SACCI_ISLAND_VERSION must contain the same semantic version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Guard published version
        id: release_guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"

            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG already points to another commit. Bump the plugin version." >&2
              exit 1
            fi

            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release_exists=false" >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            xargs -0 -n 1 php -l

      - name: Run rewrite regression checks
        run: php tests/white-label-rewrite-test.php

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/admin-islands.js
          node --check assets/js/settings.js

      - name: Build update package
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p build/sacci-island-admin
          rsync -a ./ build/sacci-island-admin/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'tests/'

          (
            cd build
            zip -qr "sacci-island-admin-v${PLUGIN_VERSION}.zip" sacci-island-admin
          )

          unzip -l "build/sacci-island-admin-v${PLUGIN_VERSION}.zip"

      - name: Create GitHub release
        if: >-
          github.event_name == 'push' &&
          steps.release_guard.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "build/sacci-island-admin-v${PLUGIN_VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "SACCI Parish Administration Suite ${PLUGIN_VERSION}" \
            --generate-notes
